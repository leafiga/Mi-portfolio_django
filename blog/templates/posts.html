{% extends 'layout.html' %}

{% block content %}

    <h1>Posts</h1>
    {% for post in posts %}
            <div class="p-3">
                <div    
                    class="card card-body card-project"
                    data-aos="fade-right"
                    data-aos-offset="300"
                    data-aos-easing="ease-in-sine"
                >
                    <div class="row">
                        <div class="col-3">
                            <img src="{{ post.image.url }}" class="img-fluid rounded" alt="{{ post.title }}">
                        </div>
                        <div class="col-9">
                            <h3>{{ post.title }}</h3>
                            <p>{{ post.date|date:"M j, Y" }}</p>
                            <p>{{ post.description|striptags|truncatechars:100 }}</p>
                            <a href="{% url 'blog:post_detail' post.id %}" class="btn btn-light">{{ post.title }}</a> 
                        </div>
                    </div>
                </div>
        </div>
    {% endfor %}

{% endblock  %}
